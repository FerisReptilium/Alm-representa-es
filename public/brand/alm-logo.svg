<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">ALM Representações</title>
  <desc id="desc">Identidade ALM com figura feminina integrada a uma flor de lótus em rosé gold.</desc>
  <defs>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f493f"/>
      <stop offset="0.25" stop-color="#b66f62"/>
      <stop offset="0.55" stop-color="#e1b1a2"/>
      <stop offset="0.8" stop-color="#b67366"/>
      <stop offset="1" stop-color="#74443d"/>
    </linearGradient>
    <linearGradient id="roseSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efc6ba"/>
      <stop offset="0.5" stop-color="#d89a8d"/>
      <stop offset="1" stop-color="#f3d4ca"/>
    </linearGradient>
  </defs>

  <!-- lotus + feminine silhouette -->
  <g fill="none" stroke="url(#rose)" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="6" d="M376 77c-31 11-51 36-59 73-7 32-5 68 7 108"/>
    <path stroke-width="6" d="M377 77c38 8 69 30 87 67 17 34 18 73 4 117"/>
    <path stroke-width="5" d="M359 93c-7 26-2 51 17 74 8 10 14 20 16 31"/>
    <path stroke-width="5" d="M391 105c28 10 47 28 57 55-18 7-32 18-42 34-8 14-12 30-12 47"/>
    <path stroke-width="5" d="M390 197c-13 9-24 24-31 43-8 22-9 48-4 78"/>
    <path stroke-width="5" d="M354 318c8 15 18 29 30 42"/>
    <path stroke-width="5" d="M384 360c12-18 20-40 24-67"/>
    <path stroke-width="5" d="M408 293c4 35 17 61 39 79"/>

    <path stroke-width="5" d="M316 167c-45-29-92-29-140 0 21 43 54 72 98 88 22-21 36-50 42-88z"/>
    <path stroke-width="5" d="M299 181c-34-8-69 0-105 24"/>
    <path stroke-width="5" d="M302 196c-23 18-41 39-53 63"/>

    <path stroke-width="5" d="M464 168c45-28 93-27 143 3-23 42-57 71-102 86-21-21-35-51-41-89z"/>
    <path stroke-width="5" d="M480 182c36-7 71 2 106 26"/>
    <path stroke-width="5" d="M478 198c24 18 43 39 56 63"/>
