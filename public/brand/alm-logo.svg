  <!-- wordmark -->
  <text x="380" y="405" text-anchor="middle" fill="url(#rose)" font-family="Georgia, 'Times New Roman', serif" font-size="132" letter-spacing="4">ALM</text>
  <text x="380" y="454" text-anchor="middle" fill="#5c4742" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="12">REPRESENTAÇÕES</text>
  <line x1="205" y1="483" x2="298" y2="483" stroke="#b66f62" stroke-width="2"/>
  <line x1="462" y1="483" x2="555" y2="483" stroke="#b66f62" stroke-width="2"/>
  <text x="380" y="490" text-anchor="middle" fill="#a86d63" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="7">BEAUTY • MAKEUP</text>
  <text x="380" y="516" text-anchor="middle" fill="#8b625b" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">Beleza que conecta negócios</text>
</svg>